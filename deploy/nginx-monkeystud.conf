server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name monkeystud.com www.monkeystud.com _;

    root /var/www/monkeystud.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|png|jpg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
